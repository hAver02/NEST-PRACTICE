services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-platzi
    environment:
      POSTGRES_DB: platzi_nest
      POSTGRES_USER: user_platzi
      POSTGRES_PASSWORD: platzi_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-platzi
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@platzi.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: